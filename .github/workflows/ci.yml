name: Public source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Boundary, synthetic tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reject private paths, secrets, and answer-bank text
        run: node scripts/check-public-boundary.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Lint public source
        run: npm run lint
      - name: Type-check shared and frontend source
        run: npm run check:types
      - name: Type-check backend source
        run: npm run check:backend
      - name: Verify migration safety
        run: npm run verify:migrations
      - name: Run synthetic smoke tests
        run: npm run test:synthetic
      - name: Build public source
        run: npm run build
